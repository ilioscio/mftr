# MFTR on a server: `docker compose -f deploy/compose.yaml up -d` from the repository root.
# One server on UDP 7777 plays every mode (players pick ARAM, Mayhem, Hyper or Classic, Versus
# or Co-op vs bots), as many matches at once as players fill. It records every match into the
# `data` volume's `replays` folder (copy one out with
# `docker compose -f deploy/compose.yaml cp mftr:/data/replays .`, then check it with
# `mftr-tools replay FILE`). The server keeps its key (`server.key`, created on first start) in
# the same volume: players' clients pin it, so keep the volume. `docker compose logs` shows the
# key's fingerprint.
services:
  mftr:
    build: ..
    image: mftr-server
    restart: unless-stopped
    ports:
      - "7777:7777/udp"
    volumes:
      - data:/data
    command: ["--seed", "1", "--replay", "/data/replays"]
    # More: "--modes", "aram,classic" to offer fewer modes; "--map", "/data/maps/x.mftrmap" for
    # Classic on a map from the map editor (put the file in the volume first).

volumes:
  data:
