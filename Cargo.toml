[workspace]
resolver = "2"
members = [
    "crates/mftr-sim",
    "crates/mftr-net",
    "crates/mftr-client",
    "crates/mftr-server",
    "crates/mftr-tools",
    "crates/mftr-gdext",
    "crates/mftr-pack",
]

[workspace.package]
version = "0.11.1"
edition = "2024"
license = "AGPL-3.0-or-later"
rust-version = "1.88"

[workspace.dependencies]
mftr-sim = { path = "crates/mftr-sim" }
mftr-net = { path = "crates/mftr-net" }
mftr-client = { path = "crates/mftr-client" }
mftr-server = { path = "crates/mftr-server" }
mftr-pack = { path = "crates/mftr-pack" }

[workspace.lints.rust]
unsafe_code = "forbid"

# The simulation optimized in dev builds too: debug clients build maps (map editor) and step the
# sim at playable speed.
[profile.dev.package.mftr-sim]
opt-level = 2

[profile.release]
debug = "line-tables-only"

# What we ship (M2 slice 6): no debug info, symbols stripped, whole-program optimization.
[profile.dist]
inherits = "release"
debug = false
strip = true
lto = "thin"
codegen-units = 1
