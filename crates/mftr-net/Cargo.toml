[package]
name = "mftr-net"
description = "MFTR wire protocol: bit-packing, packets, messages, link conditioner, clock sync."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
mftr-sim.workspace = true
# Secure transport (D40): Noise XX handshake, ChaCha20-Poly1305 packets. Not "std": that
# feature pulls in ring.
snow = { version = "0.10", default-features = false, features = ["use-chacha20poly1305", "use-blake2", "use-curve25519", "use-getrandom"] }
# Same versions snow uses: cookies, key fingerprints, randomness, public keys from private ones.
blake2 = "0.10"
getrandom = "0.3"
curve25519-dalek = { version = "4.1.3", default-features = false }

[lints]
workspace = true
