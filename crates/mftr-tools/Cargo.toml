[package]
name = "mftr-tools"
description = "MFTR developer tools: headless Netcode Lab, UDP bot client."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
mftr-sim.workspace = true
mftr-net.workspace = true
mftr-client.workspace = true
mftr-server.workspace = true
mftr-bots.workspace = true
mftr-pack.workspace = true
nanoserde = { version = "0.2", default-features = false, features = ["ron", "std"] }
# The SFX build only (A4c): libvorbis with aoTuV, as an encoder. Packs are decoded by lewton.
vorbis_rs = { version = "0.5", default-features = false }
# The release manifest: archive hashes, and randomness for a new release key.
sha2 = "0.10"
getrandom = "0.3"

[lints]
workspace = true
