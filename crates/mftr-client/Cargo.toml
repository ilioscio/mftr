[package]
name = "mftr-client"
description = "Engine-independent MFTR client runtime: clock sync, own-champion prediction, reconciliation, interpolation."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
mftr-sim.workspace = true
mftr-net.workspace = true
# The release manifest (`update`): its JSON, and its Ed25519 signature (on the curve25519-dalek
# the transport already has).
nanoserde = { version = "0.2", default-features = false, features = ["json", "std"] }
ed25519-dalek = { version = "2.1", default-features = false }
# The Windows self-update (`selfupdate`): the archive's SHA-256, and unpacking it (deflate only,
# in pure Rust).
sha2 = "0.10"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[lints]
workspace = true
