name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is Apple Silicon: together with x86_64 Linux/Windows this makes the
        # golden state hash a cross-architecture determinism check (03 §17).
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --release -- -D warnings

      - name: Tests (incl. golden state hash and Netcode Lab targets)
        run: cargo test --workspace --release

      - name: Art packs (rig standard, caps, clips, markers; 10 §8.4)
        if: matrix.os == 'ubuntu-latest'
        # `shell: bash` runs with pipefail, so a failing validation fails the step through `tee`.
        shell: bash
        run: |
          {
            echo '### Art validation'
            echo '```'
            cargo run -q --release -p mftr-tools -- pack validate art
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          # The Blender tools need Blender to run; CI at least checks they compile.
          python3 -m py_compile tools/blender/run.py tools/blender/mftr_blender/*.py

      - name: Encrypted UDP smoke test (server and bot, pinned key)
        if: matrix.os == 'ubuntu-latest'
        run: |
          # `cargo test` builds the test harnesses, not the binaries.
          cargo build -q --release -p mftr-server -p mftr-tools
          key="$RUNNER_TEMP/server.key"
          ./target/release/mftr-server --bind 127.0.0.1:7777 --key "$key" &
          sleep 1
          fp=$(./target/release/mftr-server --key "$key" --fingerprint)
          ./target/release/mftr-tools bot --server "127.0.0.1:7777#$fp" --seconds 5
          kill %1

      - name: Netcode Lab report
        shell: bash
        run: |
          {
            echo '### Netcode Lab (${{ matrix.os }})'
            echo '```'
            cargo run -q --release -p mftr-tools -- netlab --profile all --clients 10 --seconds 120
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  size:
    name: size budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: dist
      - name: Build what we ship (dist profile)
        run: cargo build --locked --profile dist -p mftr-server -p mftr-tools -p mftr-gdext
      - name: Size report (fails over budget)
        run: ./target/dist/mftr-tools size-report | tee -a "$GITHUB_STEP_SUMMARY"

  docker:
    name: server image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: mftr-server:ci

  nix:
    name: nix package and NixOS module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Let the Nix builder use KVM (fast NixOS VM tests)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: system-features = nixos-test benchmark big-parallel kvm
      - name: Build the server package
        run: nix build -L .#mftr-server
      - name: NixOS VM test (two servers, key kept across restarts, encrypted bot with a pinned key)
        run: nix build -L .#checks.x86_64-linux.nixos
